name: Android APK

on:
  push:
    branches: ['**']
    # A version tag (e.g. v0.3.0-rc.1) also publishes a pre-release with the APK attached.
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step, which runs on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mix-and-splash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish pre-release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="mix-and-splash-${GITHUB_REF_NAME}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          # Release notes: the CHANGELOG section of this version (without the -rc suffix).
          awk -v v="## ${VERSION%%-*}" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n---\nBuild di test (debug): per installarla, apri il file .apk dal telefono e consenti le origini sconosciute.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" --prerelease --title "Mix & Splash ${GITHUB_REF_NAME} (test)" --notes-file notes.md
