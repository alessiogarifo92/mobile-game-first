name: CI

# Once per commit: a branch with a PR is checked by the pull_request run, so push runs only on main (before, every PR
# commit ran the whole suite twice). A new push to a PR cancels the run still going on its previous commit.
on:
  push:
    branches: [main]
  pull_request:

# Only PR runs share a group (one per PR); every main commit gets its own run and is always checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Levels match their stage specs
        run: npm run gen:levels -- --check
      - run: npm run test:coverage
      - name: Coverage summary
        # Only when the coverage run produced a report (a failing test would otherwise add a second, misleading error).
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          echo '### Coverage (src/core)' >> "$GITHUB_STEP_SUMMARY"
          node -e "const s=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('- '+k+': '+s[k].pct+'%')" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
