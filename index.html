<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6E9" />
    <meta name="description" content="Mix & Splash — dipingi immagini a pixel mescolando rosso, giallo e blu." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Mix & Splash</title>
    <style>
      html, body { margin: 0; height: 100%; background: #FFF6E9; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      /* Phone held sideways (PWA / web): the game is portrait-only, so ask to rotate instead of showing a sliver. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; text-align: center; background: #FFF6E9; color: #2B2D42; font: 700 20px system-ui, sans-serif; }
      @media (orientation: landscape) and (max-height: 500px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate">Ruota il telefono in verticale<br />Rotate your phone to portrait</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
